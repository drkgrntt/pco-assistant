services:
  web:
    build: .
    container_name: pco-assistant-web
    restart: unless-stopped
    # Postgres stays native on the host, so the container shares the
    # host's network namespace instead of a bridge network - this keeps
    # DB_HOST=localhost in .env working unchanged and nginx proxying to
    # 127.0.0.1:$PORT exactly like the rest of the fleet (journal,
    # derekgarnett.com, etc.).
    network_mode: host
    env_file:
      - .env
